<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BUSINESS INTELLIGENCE PRODUCT</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="homePage" class="home">
    <div class="home-card">
      <p class="eyebrow">BI HUB Home Page</p>
      <h1>BUSINESS INTELLIGENCE PRODUCT</h1>
      <p>Select a tool below. Only SAR Calculator is currently active.</p>
 
      <div class="menu">
        <button onclick="openCalculator()">SAR Calculation</button>
        <button onclick="showInProduction()">FAQ</button>
        <button onclick="showInProduction()">Processing Account Lookup</button>
        <button onclick="showInProduction()">Rooftop Lookup</button>
        <button onclick="showInProduction()">SAR Chatbot</button>
      </div>
 
      <p id="productionMsg"></p>
    </div>
  </main>
 
  <main id="calculatorPage" class="app hidden">
    <button class="back-btn" onclick="goHome()">← Back Home</button>
 
    <section class="hero">
      <p class="eyebrow">Production Tool</p>
      <h1>SAR Calculator</h1>
      <p>Choose Flat Rate or Pass Through and calculate estimated annual SAR.</p>
    </section>
 
    <section class="card">
      <h2>Pricing Type</h2>
      <div class="toggle">
        <label>
          <input type="radio" name="pricingType" value="flat" checked />
          <span>Flat Rate</span>
        </label>
        <label>
          <input type="radio" name="pricingType" value="pass" />
          <span>Pass Through</span>
        </label>
      </div>
    </section>
 
    <form class="grid card">
      <div class="field">
        <label>Annual Volume</label>
        <input id="annualVolume" type="text" value="1,000,000" inputmode="decimal" />
      </div>
 
      <div class="field">
        <label>Average Ticket</label>
        <input id="averageTicket" type="number" value="100" step="0.01" />
      </div>
 
      <div class="field">
        <label>Discount Rate</label>
        <input id="discountRate" type="number" value="0.04" step="0.0001" />
      </div>
 
      <div class="field flat-field">
        <label>Auth Fee</label>
        <input id="authFee" type="number" value="0.01" step="0.001" />
      </div>
 
      <div class="field flat-field">
        <label>Annual Volume Amex</label>
        <input id="annualVolumeAmex" type="text" value="10,000" inputmode="decimal" />
      </div>
 
      <div class="field flat-field">
        <label>Average Ticket Amex</label>
        <input id="averageTicketAmex" type="number" value="100" step="0.01" />
      </div>
 
      <div class="field flat-field">
        <label>Discount Rate Amex</label>
        <input id="discountRateAmex" type="number" value="0.04" step="0.0001" />
      </div>
 
      <div class="field flat-field">
        <label>Service Fee / Monthly Fee</label>
        <input id="serviceFee" type="number" value="10" step="0.01" />
      </div>
 
      <div class="field flat-field">
        <label>Genius Software</label>
        <input id="geniusSoftware" type="number" value="0" step="0.01" />
      </div>
 
      <div class="field flat-field">
        <label>Interchange Fee</label>
        <input id="interchangeFee" type="number" value="-0.02" step="0.0001" />
      </div>
 
      <div class="field flat-field">
        <label>Customer Intelligence</label>
        <input id="customerIntelligence" type="number" value="0" step="0.01" />
      </div>
 
      <div class="field flat-field">
        <label>Other Monthly</label>
        <input id="otherMonthly" type="number" value="0" step="0.01" />
      </div>
 
      <div class="field flat-field">
        <label>Genius Hardware</label>
        <input id="geniusHardware" type="number" value="0" step="0.01" />
      </div>
 
      <div class="field pass-field">
        <label>Transaction Fee</label>
        <input id="transactionFee" type="number" value="0.01" step="0.001" />
      </div>
 
      <div class="field pass-field">
        <label>Settlement Fee</label>
        <input id="settlementFee" type="number" value="0.0015" step="0.0001" />
      </div>
 
      <div class="field pass-field">
        <label>Transaction Fee Amex</label>
        <input id="transactionFeeAmex" type="number" value="0.02" step="0.001" />
      </div>
 
      <div class="field pass-field">
        <label>Simplified Pricing Fee</label>
        <input id="simplifiedPricingFee" type="number" value="0" step="0.0001" />
      </div>
 
      <div class="field pass-field">
        <label>Association Pricing Fee</label>
        <input id="associationPricingFee" type="number" value="0" step="0.0001" />
      </div>
 
      <button type="button" onclick="calculateSAR()">Calculate SAR</button>
    </form>
 
    <section class="result card">
      <p>Estimated Annual SAR</p>
      <h2 id="sarResult">$0.00</h2>
      <div id="breakdown"></div>
    </section>
  </main>
 
  <script src="script.js"></script>
</body>
</html>
